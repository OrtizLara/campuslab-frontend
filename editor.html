<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="CampusLab, banco de proyectos académicos"><title>Crear proyecto | CampusLab</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head>
<body><div id="site-nav"></div><div id="demo-banner"></div><main><section class="page-header"><div class="container"><p class="eyebrow">Área docente</p><h1 id="page-title">Nuevo proyecto</h1><p class="text-muted">Completá la información principal del trabajo.</p></div></section><section class="section pt-4"><div class="container"><div class="row"><div class="col-lg-9 col-xl-8"><div id="feedback"></div><div class="content-panel"><form id="project-form"><div class="mb-4"><label class="form-label" for="title">Título del proyecto *</label><input class="form-control" id="title" required maxlength="180" placeholder="Ej. Sistema de biblioteca digital"></div><div class="mb-4"><label class="form-label" for="description">Descripción *</label><textarea class="form-control" id="description" required rows="5" placeholder="¿Qué problema resuelve? ¿Cómo funciona?"></textarea></div><div class="mb-4"><label class="form-label" for="course">Cursada</label><select id="course" class="form-select"><option value="">Cargando cursadas...</option></select></div><div class="mb-4"><label class="form-label" for="technologies">Tecnologías</label><input id="technologies" class="form-control" placeholder="HTML, CSS, JavaScript"><small class="text-muted">Separalas con comas. El backend podría requerir IDs en lugar de nombres.</small></div><div class="mb-4"><label class="form-label" for="project-link">Enlace del proyecto (opcional)</label><input id="project-link" type="url" class="form-control" placeholder="https://github.com/..." ></div><div class="mb-4"><label class="form-label" for="cover">Imagen o archivo (opcional)</label><input id="cover" type="file" class="form-control" accept="image/*,.pdf"><small class="text-muted">Se envía a /assets después de guardar. Revisar nombre de campo según Swagger.</small></div><div class="d-flex gap-3 flex-wrap"><button class="btn btn-primary" id="form-submit" type="submit">Crear proyecto</button><a href="dashboard.html" class="btn btn-outline-secondary">Cancelar</a></div></form></div></div></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/editor.js"></script></body></html>
