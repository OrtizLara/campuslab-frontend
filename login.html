<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="CampusLab, banco de proyectos académicos"><title>Ingresar | CampusLab</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/styles.css" rel="stylesheet"></head>
<body><div id="site-nav"></div><div id="demo-banner"></div><main><section class="section section-tint" style="min-height:70vh"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5"><div class="auth-card"><p class="eyebrow">Acceso docente</p><h1 class="h2 fw-bold">Bienvenido de nuevo</h1><p class="text-muted mb-4">Ingresá con las credenciales de tu cuenta.</p><div id="feedback"></div><form id="login-form"><div class="mb-3"><label for="email" class="form-label">Correo electrónico</label><input id="email" class="form-control" type="email" placeholder="correo@institucion.edu" required></div><div class="mb-3"><label for="password" class="form-label">Contraseña</label><input id="password" class="form-control" type="password" minlength="1" required></div><div class="form-check mb-4"><input id="remember" class="form-check-input" type="checkbox"><label class="form-check-label" for="remember">Mantener sesión en este navegador</label></div><button id="login-submit" class="btn btn-primary w-100" type="submit">Ingresar</button></form><hr class="my-4"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="mode-demo"><label class="form-check-label fw-bold" for="mode-demo">Usar modo demostración</label></div><p id="mode-hint" class="mode-note mt-2 mb-1"></p><p class="mode-note mb-0">En modo demo podés ingresar cualquier correo y contraseña: no se conecta con el backend.</p></div></div></div></div></section></main><div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="js/login.js"></script></body></html>
